<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/whitetheme.css" />
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <title>Bookology</title>
</head>

<body>
    <!-- HEADER & NAV -->
    <div class="header">
        <header>
            <a href="index.html">
                <h1><i class="fa fa-book"></i> Bookology</h1>
            </a>
        </header>
        <nav>
            <ul>
                <li><input class="themebutton" type="button" value="🌙 Dark Theme"></li>
                <li><a href="categories.html"><i class="fa fa-th-large"></i> Categories</a></li>
                <li><a href="favorites.html"><i class="fa fa-heart"></i> Favorites</a></li>
                <li><a href="trending.html"><i class="fa fa-fire"></i> Trending</a></li>
                <li><a href="cart.html"><i class="fa fa-shopping-cart"></i> Cart</a></li>
                <li><a href="review.html"><i class="fa review"></i>review</a></li>
                <li><a href="about.html"><i class="fa fa-info-circle"></i> About</a></li>
                <li><a href="contact.html"><i class="fa fa-envelope"></i> Contact Us</a></li>
                <li><a href="login.html"><i class="fa fa-sign-in"></i> Login</a></li>
                <li><a href="register.html"><i class="fa fa-user-plus"></i> Register</a></li>
            </ul>
        </nav>
    </div>
    <div class="container">
        <div class="review-section">
            <h2 style="text-align: center;">books review</h2>


            <!-- الفورم -->
            <form id="bookForm" novalidate>
                <div class="input-group">
                    <label>name of the book: </label>
                    <input type="text" id="title" placeholder="name">
                    <div id="titleErr" class="error-text">please enter the name of the book</div>
                </div>
                <div class="input-group">
                    <label>rating :</label>
                    <select id="rate">
                        <option value="5">⭐⭐⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="1">⭐</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>your opinion :</label>
                    <textarea id="msg" rows="4" placeholder=""></textarea>
                    <div id="msgErr" class="error-text"></div>
                </div>
                <button type="submit" class="btn-submit">puplish</button>
            </form>


            <div class="footer">
                <footer>
                    <p>© 2026 Bookology — All rights reserved</p>
                </footer>
            </div>

            <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
            <script src="javascript/script.js"></script>
            <script src="javascript/FormValidator.js"></script>
        </div>
    </div>
</body>

</html>
