<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/whitetheme.css" />
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <title>Bookology</title>
</head>

<body>
    <!-- HEADER & NAV -->
    <div class="header">
        <header>
            <a href="index.html">
                <h1><i class="fa fa-book"></i> Bookology</h1>
            </a>
        </header>
        <nav>
            <ul>
                <li><input class="themebutton" type="button" value="🌙 Dark Theme"></li>
                <li><a href="categories.html"><i class="fa fa-th-large"></i> Categories</a></li>
                <li><a href="favorites.html"><i class="fa fa-heart"></i> Favorites</a></li>
                <li><a href="trending.html"><i class="fa fa-fire"></i> Trending</a></li>
                <li><a href="cart.html"><i class="fa fa-shopping-cart"></i> Cart</a></li>
                <li><a href="review.html"><i class="fa review"></i>review</a></li>
                <li><a href="about.html"><i class="fa fa-info-circle"></i> About</a></li>
                <li><a href="contact.html"><i class="fa fa-envelope"></i> Contact Us</a></li>
                <li><a href="login.html"><i class="fa fa-sign-in"></i> Login</a></li>
                <li><a href="register.html"><i class="fa fa-user-plus"></i> Register</a></li>
            </ul>
        </nav>
    </div>
    <main>
        <h1>إنشاء حساب</h1>
        <form id="register">

            <div>
                <input type="text" id="userName-sign" placeholder="ادخل اسمك" />
                <span class="error-msg" id="userName-sign-error"></span>
            </div>
            <br>

            <div>
                <input type="email" id="email" placeholder="ادخل عنوان البريد الالكتروني" />
                <span class="error-msg" id="email-error"></span>
            </div>
            <br>

            <div>
                <input type="date" id="date" />
                <span class="error-msg" id="date-error"></span>
            </div>
            <br>

            <div>
                <input type="radio" name="gender" value="male" /> <label>ذكر</label>
                <input type="radio" name="gender" value="female" /> <label>أنثى</label>
                <span class="error-msg" id="gender-error"></span>
            </div>
            <br>

            <div>
                <input type="password" id="password-sign" placeholder="ادخل كلمة المرور" />
                <span class="error-msg" id="password-sign-error"></span>
            </div>
            <br>

            <!-- confirm password — was missing before -->
            <div>
                <input type="password" id="confirm-password" placeholder="تأكيد كلمة المرور" />
                <span class="error-msg" id="confirm-password-error"></span>
            </div>
            <br>

            <div>
                <button type="submit">إنشاء حساب</button>
                <button type="reset" class="reset">مسح</button>
            </div>

            <p class="success-msg" id="register-success"></p>
        </form>
    </main>

    <div class="footer">
        <footer><p>© 2026 Bookology — All rights reserved</p></footer>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="javascript/script.js"></script>
    <script src="javascript/FormValidator.js"></script>
</body>
</html>
