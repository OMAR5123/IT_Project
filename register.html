    <h1>إنشاء حساب</h1>
    <form action="index.html">
        <div>
            <input type="text" id="userName-sign" placeholder="ادخل اسمك" required>
        </div>
        <br>
        <div>
            <input type="email" id="email" required placeholder="ادخل عنوان البريد الالكتروني" autocomplete="">
        </div>
        <br>
        <div>
            <input type="date" name="date" id="date">
        </div>
        <br>
        <div>
            <input type="radio" name="gender" id="gender" value="male">
            <label>ذكر</label>
            <input type="radio" name="gender" id="gender" value="female">
            <label>
                أنثى
            </label>
        </div>
        <br>
        <div>
            <input type="password" name="password-sign" placeholder="ادخل كلمة المرور" required>

        </div>
        <br>
        <div>
            <button type="submit">إنشاء حساب</button>
            <br>
            <button type="reset" class="reset">مسح</button>


        </div>
